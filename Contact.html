<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="Contact.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Contact-Us</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a href="" class="navbar-brand">
                    <img src="Assets/images/lamp.png" alt="">
                </a>
                <a href="" class="navbar-brand-name text-decoration-none">NobleBit-Solutions</a>
                <button 
                    class="navbar-toggler" 
                    type="button" data-bs-toggle="collapse" 
                    data-bs-target="#main" aria-controls="main" 
                    aria-expanded="false" 
                    aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="collapse navbar-collapse" id="main">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link p-2 p-lg-3 active" href="/NobleBit-Solutions/index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link p-2 p-lg-3" href="/NobleBit-Solutions/index.html">AboutUs</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link p-2 p-lg-3" href="/NobleBit-Solutions/index.html">Portfolio</a>
                        </li>
                        
                    </ul>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link p-2 p-lg-3" href="/NobleBit-Solutions/index.html">Contact</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav dark-light-mood">
                    <li>
                        <span class="nav-link theme-toggle">
                            <i class="fa-solid fa-sun"></i>
                            <i class="fa-solid fa-moon"></i>
                        </span>
                    </li>
                </ul>
                </div>

            </div>
                
    </header>

    <div class="contact-form pt-3">
        <div class="container">
            <h2 class="text-center mb-4 pt-5 pb-2">Get in Touch</h2>
            <p class="text-center">We'd love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.</p>
            <form action="" method="get" class="col-md-6 col-lg-4 m-5 mt-3" id="contact-form" novalidate>
                <div class="mb-1">
                    <label for="firstname" class="form-label" name = "firstname">First Name</label>
                    <input type="text" class="form-control mb-2" id="firstname" placeholder="Enter your FirstName" required>
                    <div class="error" id="fname-error"></div>
                </div>
                <div class="mb-1">
                    <label for="lastname" class="form-label" name = "lastname">Last Name</label>
                    <input type="text" class="form-control" id="lastname" placeholder="Enter your LastName" required>
                    <div class="error" id="lname-error"></div>
                </div>
                <div class="mb-1">
                    <label for="email" class="form-label" name = "email">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    <div class="error" id="email-error"></div>
                </div>
                <div class="mb-3 w-100">
                    <label for="message" class="form-label" name = "message">Message</label>
                    <textarea class="form-control" id="message" rows="5" placeholder="We'd love to hear from you!" autocomplete="off" required></textarea>
                </div>
                <button type="submit" class="btn" id="submit">Submit</button>
            </form>
        </div>
    </div>  
    <script src="contact.js"></script> 
</body>
</html>
